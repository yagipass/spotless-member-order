[versions]
errorprone = "2.50.0"
junit = "6.1.3"
maven = "3.10.0"
spotless-gradle = "8.10.3"
spotless-maven = "3.10.3"

[libraries]
apache-maven = { module = "org.apache.maven:apache-maven", version.ref = "maven" }
eclipse-jdt-core = "org.eclipse.jdt:org.eclipse.jdt.core:3.47.0"
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-tidy = "io.github.yagipass:errorprone-tidy:0.1.0"
jspecify = "org.jspecify:jspecify:1.0.1"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
nullaway = "com.uber.nullaway:nullaway:0.14.2"
spotless-lib = "com.diffplug.spotless:spotless-lib:4.10.3"
spotless-maven-plugin = { module = "com.diffplug.spotless:spotless-maven-plugin", version.ref = "spotless-maven" }

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
maven-publish = "com.vanniktech.maven.publish:0.37.0"
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-gradle" }
